name: Release

# A tag is the only thing that publishes. Nothing here runs on a branch push, so a
# release can never be cut from a half-merged tree, and the binary users download is
# the one this workflow built from the tag in public.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# Two tags pushed at once must not race for the same release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, test and publish
    runs-on: windows-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Check out the tag
        uses: actions/checkout@v7
        with:
          # git describe needs the tags, and the release notes are built from the log.
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: |
            NitroLite.Core/NitroLite.Core.csproj
            NitroLite.Windows/NitroLite.Windows.csproj
            NitroLite.Desktop/NitroLite.Desktop.csproj
            NitroLite.Tests/NitroLite.Tests.csproj

      - name: Read the version from the project file
        id: version
        shell: pwsh
        run: |
          [xml]$proj = Get-Content NitroLite.Desktop/NitroLite.Desktop.csproj
          $version = ($proj.Project.PropertyGroup | ForEach-Object { $_.Version } | Where-Object { $_ } | Select-Object -First 1)
          if (-not $version) { throw 'Version not found in NitroLite.Desktop.csproj' }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "NitroLite.Desktop.csproj says $version, the tag says $env:TAG"

      - name: Check the tag matches the project version
        shell: pwsh
        run: |
          $tag = $env:TAG.TrimStart('v', 'V')
          $version = '${{ steps.version.outputs.version }}'
          if ($tag -ne $version) {
            throw "Tag $env:TAG does not match <Version>$version</Version> in NitroLite.Desktop.csproj. Bump the project file and retag, or delete the tag."
          }
          Write-Host "Tag and project version agree: $version"

      - name: Test
        # The packaging script runs the same suite unless it is told not to. Running it
        # here instead keeps the result visible as its own step, and runs it only once.
        run: dotnet test NitroLite.Tests/NitroLite.Tests.csproj -c Release --nologo -v q

      - name: Package
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/publish-release.ps1 -SkipTests

      - name: Write the SHA-256 file
        id: package
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $zip = "artifacts/NitroLite-v$version-win-x64.zip"
          if (-not (Test-Path $zip)) { throw "The packaging script did not produce $zip" }
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash
          # sha256sum format, so `sha256sum -c` and Get-FileHash agree on the same file.
          "$hash  NitroLite-v$version-win-x64.zip" | Set-Content "$zip.sha256" -Encoding ascii
          "zip=$zip" >> $env:GITHUB_OUTPUT
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          Write-Host "SHA-256 $hash"

      - name: Upload the package as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: NitroLite-v${{ steps.version.outputs.version }}-win-x64
          path: |
            artifacts/NitroLite-v${{ steps.version.outputs.version }}-win-x64.zip
            artifacts/NitroLite-v${{ steps.version.outputs.version }}-win-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Build the release notes
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $hash = '${{ steps.package.outputs.sha256 }}'
          # Backticks are escape characters inside a double-quoted here-string, so the
          # markdown fences are built from a variable instead of being written literally.
          ${tick} = [char]96
          $fence = "${tick}${tick}${tick}"
          $fencePs = $fence + 'powershell'

          # A curated CHANGELOG.md section wins over the raw commit log: the log is a list of
          # commit subjects, which is not what a user wants to read. The log stays as the
          # fallback, so a tag without an entry still publishes something true.
          $changes = $null
          if (Test-Path 'CHANGELOG.md') {
            $lines = Get-Content 'CHANGELOG.md' -Encoding UTF8
            # Built by concatenation: "$" inside a double-quoted pattern is a variable reference.
            $heading = '^##\s+\[?v?' + [regex]::Escape($version) + '\]?(\s|$)'
            $start = -1
            for ($i = 0; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match $heading) { $start = $i + 1; break }
            }
            if ($start -ge 0) {
              $body = New-Object System.Collections.Generic.List[string]
              for ($i = $start; $i -lt $lines.Count; $i++) {
                if ($lines[$i] -match '^##\s') { break }
                $body.Add($lines[$i])
              }
              $text = ($body -join [char]10).Trim()
              if ($text) {
                $changes = $text
                Write-Host "Release notes taken from the CHANGELOG.md section for $version."
              }
            }
          }

          if (-not $changes) {
            Write-Host "No CHANGELOG.md section for $version; falling back to the commit log."
            $previous = git describe --tags --abbrev=0 "$env:TAG^" 2>$null
            if ($LASTEXITCODE -ne 0 -or -not $previous) { $previous = $null }
            $range = if ($previous) { "$previous..$env:TAG" } else { $env:TAG }
            # git log returns one string per commit; joining with a space would flatten the
            # whole changelog into a single line.
            $changes = (git log $range --no-merges --pretty=format:'- %s (%h)') -join [char]10
            if (-not $changes) { $changes = '- No commits recorded for this tag.' }
          }

          $notes = @"
          NitroLite v${version}: a lightweight, open-source replacement for NitroSense on Acer Nitro laptops.

          Built by GitHub Actions from the ${tick}$env:TAG${tick} tag on a clean windows-latest runner. The log of
          that build is linked at the bottom of this page, so the binary can be traced back to the source it came
          from.

          ## Install

          1. Download ${tick}NitroLite-v$version-win-x64.zip${tick} below.
          2. Extract it to a permanent folder, for example ${tick}C:\Users\<you>\Programs\NitroLite${tick}. Do not
             leave it in Downloads: the autostart entry remembers where the exe lives.
          3. Run ${tick}NitroLite\NitroLite.exe${tick}. No installer, no .NET install needed.

          Or with Scoop:

          $fencePs
          scoop install https://raw.githubusercontent.com/canerztk8/NitroLite/main/packaging/scoop/nitrolite.json
          $fence

          ## Linux (experimental)

          ${tick}NitroLite-v$version-linux-x64.tar.gz${tick} is built on ubuntu-latest from the same tag. It needs the
          in-kernel ${tick}acer-wmi${tick} module, and ${tick}Linuwu-Sense${tick} for the keyboard lighting and the extra
          switches. Extract it and run ${tick}./install.sh${tick}; the installer offers to add the udev rule that lets
          the app write to the Acer attributes without root.

          $fence
          tar -xzf NitroLite-v$version-linux-x64.tar.gz
          cd NitroLite-linux-x64
          ./install.sh
          $fence

          ## Verify the download

          $fencePs
          Get-FileHash .\NitroLite-v$version-win-x64.zip -Algorithm SHA256
          $fence

          The digest must be:

          $fence
          $hash
          $fence

          The same value is attached as ${tick}NitroLite-v$version-win-x64.zip.sha256${tick}.

          ## SmartScreen

          NitroLite is not code-signed, so Windows shows "Windows protected your PC" the first time you run it. That
          warning is about the missing publisher signature, not about anything found in the file. Choose
          **More info -> Run anyway**, or install through Scoop, which does not set the Mark of the Web.

          ## What changed

          $changes
          "@

          # Written without a BOM: gh would otherwise carry it into the release body.
          [IO.File]::WriteAllText((Join-Path $PWD 'release-notes.md'), $notes, (New-Object Text.UTF8Encoding $false))
          Write-Host $notes

      - name: Publish the GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $zip = "artifacts/NitroLite-v$version-win-x64.zip"
          # --verify-tag refuses to invent a tag that is not on the remote.
          gh release create "v$version" $zip "$zip.sha256" `
            --title "NitroLite v$version" `
            --notes-file release-notes.md `
            --verify-tag

      - name: Summarise
        if: always()
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          @"
          ### NitroLite v$version

          | | |
          |---|---|
          | Tag | ${env:TAG} |
          | Package | NitroLite-v$version-win-x64.zip |
          | SHA-256 | ${{ steps.package.outputs.sha256 }} |
          | Release | https://github.com/${{ github.repository }}/releases/tag/v$version |
          "@ >> $env:GITHUB_STEP_SUMMARY

  # The Linux build runs after the Windows one has created the release, and attaches its archive to it. Ordering it
  # this way means the release notes and the Windows zip are already published when the Linux job starts, so a Linux
  # failure leaves a usable release behind instead of an empty tag.
  linux-package:
    name: Linux package
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: Check out the tag
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: |
            NitroLite.Core/NitroLite.Core.csproj
            NitroLite.Linux/NitroLite.Linux.csproj
            NitroLite.Windows/NitroLite.Windows.csproj
            NitroLite.Desktop/NitroLite.Desktop.csproj

      - name: Read the version from the project file
        id: version
        run: |
          set -euo pipefail
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' NitroLite.Desktop/NitroLite.Desktop.csproj | head -1)
          if [ -z "$version" ]; then echo "::error::Version not found in NitroLite.Desktop.csproj"; exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "NitroLite.Desktop.csproj says $version, the tag says $TAG"

      - name: Publish the self-contained single-file build
        run: >
          dotnet publish NitroLite.Desktop/NitroLite.Desktop.csproj
          -c Release -f net10.0 -r linux-x64 --self-contained true -p:PublishSingleFile=true
          -o staging/NitroLite-linux-x64 --nologo

      - name: Assemble and verify the tarball
        id: package
        run: |
          set -euo pipefail
          APP=staging/NitroLite-linux-x64
          VERSION='${{ steps.version.outputs.version }}'

          # share/ rather than the top level: "nitrolite.desktop" and "NitroLite.Desktop" are the same name on a
          # case-insensitive file system, and one of them is the executable.
          mkdir -p "$APP/share"
          install -m 755 packaging/linux/install.sh   "$APP/install.sh"
          install -m 755 packaging/linux/uninstall.sh "$APP/uninstall.sh"
          install -m 644 packaging/linux/nitrolite.desktop  "$APP/share/nitrolite.desktop"
          install -m 644 packaging/linux/nitrolite.svg      "$APP/share/nitrolite.svg"
          install -m 644 packaging/linux/99-nitrolite.rules "$APP/share/99-nitrolite.rules"
          rm -f "$APP"/*.pdb

          mkdir -p artifacts
          TARBALL="artifacts/NitroLite-v$VERSION-linux-x64.tar.gz"
          tar -czf "$TARBALL" -C staging NitroLite-linux-x64
          ( cd artifacts && sha256sum "$(basename "$TARBALL")" > "$(basename "$TARBALL").sha256" )

          # A broken script or a missing binary is a broken download, so both are checked before anything is uploaded.
          bash -n "$APP/install.sh"
          bash -n "$APP/uninstall.sh"
          tar -tzf "$TARBALL" | grep -qx NitroLite-linux-x64/NitroLite.Desktop
          tar -tzf "$TARBALL" | grep -qx NitroLite-linux-x64/libSkiaSharp.so

          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          echo "sha256=$(cut -d' ' -f1 "$TARBALL.sha256")" >> "$GITHUB_OUTPUT"

      - name: Attach the Linux package to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" \
            "${{ steps.package.outputs.tarball }}" \
            "${{ steps.package.outputs.tarball }}.sha256" \
            --clobber

      - name: Summarise
        if: always()
        run: |
          {
            echo "### NitroLite Linux package"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Tag | $TAG |"
            echo "| Archive | $(basename "${{ steps.package.outputs.tarball }}") |"
            echo "| SHA-256 | ${{ steps.package.outputs.sha256 }} |"
          } >> "$GITHUB_STEP_SUMMARY"
