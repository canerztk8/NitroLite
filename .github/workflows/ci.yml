name: CI

# Every push and every pull request. The Windows job is the gate that has always existed; the Linux job is what
# keeps the cross-platform half honest, because a change that only compiles on Windows is a change that breaks the
# Linux build silently until someone tries it.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows build and tests
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET 10
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          # The exact SDK in global.json, the one local builds use too, so the analyzers that turn warnings into errors
          # are the same here and on a developer's machine. Moving to a newer SDK is a one-line change to that file.
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            NitroLite.Core/NitroLite.Core.csproj
            NitroLite.Linux/NitroLite.Linux.csproj
            NitroLite.Windows/NitroLite.Windows.csproj
            NitroLite.Desktop/NitroLite.Desktop.csproj
            NitroLite.Tests/NitroLite.Tests.csproj

      # The solution build covers every project, but the Windows half of NitroLite.Desktop is the one that ships, so
      # it is also built on its own. A multi-targeted project can build for net10.0 and still fail for
      # net10.0-windows, and that failure would otherwise only appear at release time.
      #
      # -warnaserror is belt and braces: Directory.Build.props already sets TreatWarningsAsErrors, and passing it on
      # the command line means a project that opts out of the shared props still cannot land a warning on main.
      - name: Build
        run: dotnet build NitroLite.sln -c Release --nologo -warnaserror

      - name: Build the Windows front end
        run: dotnet build NitroLite.Desktop/NitroLite.Desktop.csproj -c Release -f net10.0-windows --nologo -warnaserror

      - name: Test
        run: dotnet test NitroLite.Tests/NitroLite.Tests.csproj -c Release --no-build --nologo

  linux:
    name: Linux build and package
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET 10
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          # The exact SDK in global.json, the one local builds use too, so the analyzers that turn warnings into errors
          # are the same here and on a developer's machine. Moving to a newer SDK is a one-line change to that file.
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            NitroLite.Core/NitroLite.Core.csproj
            NitroLite.Linux/NitroLite.Linux.csproj
            NitroLite.Desktop/NitroLite.Desktop.csproj

      # The solution file cannot be built here: NitroLite (WPF), NitroLite.Windows and NitroLite.Tests target
      # net10.0-windows. These three projects are the ones that have to compile on Linux, so they are built one by one
      # and a failure in any of them fails the job.
      #
      # NitroLite.Desktop multi-targets net10.0 and net10.0-windows, so every command names the Linux framework
      # explicitly. Without -f the build would try the Windows half too and fail on a machine with no Windows Desktop
      # targeting pack — which is exactly the failure this job exists to catch, just in the wrong place.
      - name: Build NitroLite.Core
        run: dotnet build NitroLite.Core/NitroLite.Core.csproj -c Release --nologo -warnaserror

      - name: Build NitroLite.Linux
        run: dotnet build NitroLite.Linux/NitroLite.Linux.csproj -c Release --nologo -warnaserror

      - name: Build NitroLite.Desktop
        run: dotnet build NitroLite.Desktop/NitroLite.Desktop.csproj -c Release -f net10.0 --nologo -warnaserror

      - name: Publish the self-contained single-file build
        run: >
          dotnet publish NitroLite.Desktop/NitroLite.Desktop.csproj
          -c Release -f net10.0 -r linux-x64 --self-contained true -p:PublishSingleFile=true
          -o staging/NitroLite-linux-x64 --nologo

      # The Windows package is trimmed (scripts/publish-release.ps1 sets PublishTrimmed), the Linux one is not: the
      # trimmer's output can only be proven by running it, and nothing in this workflow runs a Linux binary. What this
      # step does prove is that the trim step itself still succeeds for linux-x64 with the roots NitroLite.Desktop
      # declares, so a change that breaks trimming on Linux fails here instead of on the day someone enables it.
      #
      # It is a separate output directory on purpose: the tarball below is built from the untrimmed publish, so a
      # trimmed binary can never end up in a package nobody has run.
      - name: Verify the trim step still succeeds for linux-x64
        run: |
          set -euo pipefail
          dotnet publish NitroLite.Desktop/NitroLite.Desktop.csproj -c Release -f net10.0 -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=true -o staging/NitroLite-linux-x64-trimcheck --nologo -warnaserror

          test -s staging/NitroLite-linux-x64-trimcheck/NitroLite.Desktop || {
            echo "::error::the trimmed publish produced no binary"; exit 1; }

          echo "### Trim check" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| | |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Untrimmed | $(du -h staging/NitroLite-linux-x64/NitroLite.Desktop | cut -f1) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Trimmed | $(du -h staging/NitroLite-linux-x64-trimcheck/NitroLite.Desktop | cut -f1) |" >> "$GITHUB_STEP_SUMMARY"

      - name: Assemble the tarball
        run: |
          set -euo pipefail
          APP=staging/NitroLite-linux-x64

          # The launcher, the icon and the udev rule go in share/ rather than next to the binary: "nitrolite.desktop"
          # and "NitroLite.Desktop" are the same name on a case-insensitive file system, and one of them is the
          # executable.
          mkdir -p "$APP/share"
          install -m 755 packaging/linux/install.sh   "$APP/install.sh"
          install -m 755 packaging/linux/uninstall.sh "$APP/uninstall.sh"
          install -m 644 packaging/linux/nitrolite.desktop "$APP/share/nitrolite.desktop"
          install -m 644 packaging/linux/nitrolite.svg     "$APP/share/nitrolite.svg"
          install -m 644 packaging/linux/99-nitrolite.rules "$APP/share/99-nitrolite.rules"
          install -m 644 packaging/linux/nitrolite-helper.socket "$APP/share/nitrolite-helper.socket"
          install -m 644 packaging/linux/nitrolite-helper.service.in "$APP/share/nitrolite-helper.service.in"
          install -m 644 packaging/linux/io.github.canerztk8.nitrolite.policy "$APP/share/io.github.canerztk8.nitrolite.policy"

          # Debug symbols are not shipped: they double the archive and help nobody who is not debugging a crash.
          rm -f "$APP"/*.pdb

          mkdir -p artifacts
          tar -czf artifacts/NitroLite-linux-x64.tar.gz -C staging NitroLite-linux-x64
          sha256sum artifacts/NitroLite-linux-x64.tar.gz > artifacts/NitroLite-linux-x64.tar.gz.sha256

      - name: Verify the tarball
        run: |
          set -euo pipefail
          TARBALL=artifacts/NitroLite-linux-x64.tar.gz
          test -s "$TARBALL" || { echo "::error::the tarball was not produced"; exit 1; }

          # The archive is only useful if it carries the executable, the native libraries SkiaSharp and HarfBuzz are
          # dlopen'd from, and the installer. Listing it and grepping is the cheapest way to prove that.
          tar -tzf "$TARBALL" > listing.txt
          cat listing.txt
          for member in \
            NitroLite-linux-x64/NitroLite.Desktop \
            NitroLite-linux-x64/libSkiaSharp.so \
            NitroLite-linux-x64/install.sh \
            NitroLite-linux-x64/uninstall.sh \
            NitroLite-linux-x64/share/nitrolite.desktop \
            NitroLite-linux-x64/share/99-nitrolite.rules
          do
            grep -qx "$member" listing.txt || { echo "::error::$member is missing from the tarball"; exit 1; }
          done

          # The scripts are executed by bash on the user's machine, so a syntax error here is a broken install there.
          bash -n staging/NitroLite-linux-x64/install.sh
          bash -n staging/NitroLite-linux-x64/uninstall.sh

          # The desktop entry has to be parseable, and desktop-file-validate is the tool that decides that.
          sudo apt-get update -qq
          sudo apt-get install -y -qq desktop-file-utils
          desktop-file-validate staging/NitroLite-linux-x64/share/nitrolite.desktop

          echo "### Linux package" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| | |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Archive | NitroLite-linux-x64.tar.gz |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Size | $(du -h "$TARBALL" | cut -f1) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| SHA-256 | $(cut -d' ' -f1 artifacts/NitroLite-linux-x64.tar.gz.sha256) |" >> "$GITHUB_STEP_SUMMARY"

      # The .deb and .rpm, built by the script the release uses, then installed with apt and dnf in clean containers:
      # that resolves the declared dependencies exactly as on a user's machine, puts every file where systemd, polkit
      # and the desktop look, starts the program headless, and removes it again. A package that would install and do
      # nothing fails here instead of on someone's laptop.
      - name: Build the .deb and .rpm
        id: packages
        run: |
          set -euo pipefail
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' NitroLite.Desktop/NitroLite.Desktop.csproj | head -1)
          bash packaging/linux/build-packages.sh "$version" artifacts >> "$GITHUB_OUTPUT"

      - name: Install the .deb in a clean Ubuntu container
        run: docker run --rm -v "$PWD/artifacts:/pkg:ro" -v "$PWD/packaging/linux:/t:ro" ubuntu:24.04 sh /t/test-package.sh deb

      - name: Install the .rpm in a clean Fedora container
        run: docker run --rm -v "$PWD/artifacts:/pkg:ro" -v "$PWD/packaging/linux:/t:ro" fedora:44 sh /t/test-package.sh rpm

      - name: Upload the Linux packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: NitroLite-linux-x64
          path: |
            artifacts/NitroLite-linux-x64.tar.gz
            artifacts/NitroLite-linux-x64.tar.gz.sha256
            ${{ steps.packages.outputs.deb }}
            ${{ steps.packages.outputs.rpm }}
          if-no-files-found: error
          retention-days: 30
