ShortDescription: Lightweight open-source replacement for NitroSense on Acer Nitro laptops
Description: >-
  NitroLite controls the operating mode, fan speed, CPU boost, GPU (MUX) mode, keyboard RGB and the 80 % charge
  limit of Acer Nitro laptops through the same Acer services NitroSense uses, with no kernel driver and no
  background service of its own. It also adds a software fan curve, per-game profiles, an on-screen display,
  battery wear history and a set of repair tools. The interface is available in eight languages.
